name: deploy
# Deploy only after ci passes on main, so nothing ships unchecked. To redeploy by hand, run ci.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # GitHub can deliver a push event late (cd587b2 arrived 10 min after the next commit). Only the commit that is
  # still the tip of main deploys, so a late ci run can never roll the site back.
  latest:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      is_tip: ${{ steps.tip.outputs.is_tip }}
    steps:
      - id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          TIP=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$TIP" = "$SHA" ]; then echo "is_tip=true" >> "$GITHUB_OUTPUT"; else echo "::notice::$SHA is not the tip of main ($TIP), skipping deploy"; echo "is_tip=false" >> "$GITHUB_OUTPUT"; fi
  build:
    needs: latest
    if: needs.latest.outputs.is_tip == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run assets
      - run: npm run build
      - name: Grep gate G1 on the deployed bundle
        env:
          BRANDGUARD: ${{ secrets.BRANDGUARD }}
        run: |
          if [ -z "$BRANDGUARD" ]; then echo "::warning::BRANDGUARD secret missing, G1 skipped"; exit 0; fi
          node scripts/grep-gates.mjs G1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
