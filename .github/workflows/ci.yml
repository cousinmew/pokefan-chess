name: ci
on:
  push:
    branches: [main]
  pull_request:
  # Manual run, for when GitHub drops a push event (cd587b2 got no runs on 2026-10-05).
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix worker
      - run: npm run lint
      - run: npm run typecheck
      # Assets first: unit tests check the shiny sprites exist for every catchable species.
      - run: npm run assets
      - run: npm test
      - run: npm run build
      - name: Grep gates G3 G5
        run: node scripts/grep-gates.mjs G3 G5
      - name: Grep gate G1 (brand)
        env:
          BRANDGUARD: ${{ secrets.BRANDGUARD }}
        run: |
          if [ -z "$BRANDGUARD" ]; then echo "::warning::BRANDGUARD secret missing, G1 skipped"; exit 0; fi
          node scripts/grep-gates.mjs G1
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e
