name: ci
on:
  push:
    branches: [main]
  pull_request:
  # Manual run, for when GitHub drops a push event (cd587b2 got no runs on 2026-10-05).
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix worker
      - run: npm run lint
      - run: npm run typecheck
      # Assets first: unit tests check the shiny sprites exist for every catchable species.
      - run: npm run assets
      - run: npm test
      - run: npm run build
      - name: Grep gates G3 G5
        run: node scripts/grep-gates.mjs G3 G5
      - name: Grep gate G1 (brand)
        env:
          BRANDGUARD: ${{ secrets.BRANDGUARD }}
          FORK_PR: ${{ github.event.pull_request.head.repo.fork == true }}
        # Fails closed (23 Oct): a missing secret is an error, except on a fork's pull request, which never gets secrets.
        run: |
          if [ -z "$BRANDGUARD" ] && [ "$FORK_PR" = "true" ]; then echo "::warning::fork pull request, no secrets: G1 skipped"; exit 0; fi
          if [ -z "$BRANDGUARD" ]; then echo "::error::BRANDGUARD secret missing, G1 cannot run"; exit 1; fi
          node scripts/grep-gates.mjs G1
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e
