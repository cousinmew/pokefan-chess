name = "pokefan-chess-relay"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
# HTTPS origins only. Local tests pass their localhost origin with --var (playwright.config.ts).
ALLOWED_ORIGINS = "https://pokefanchess.com,https://cousinmew.github.io"
RECONNECT_MS = "60000"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "VAULT"
class_name = "Vault"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Vault"]
