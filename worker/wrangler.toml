name = "pokefan-chess-relay"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://pokefanchess.com,http://pokefanchess.com,https://cousinmew.github.io,http://localhost:4173,http://localhost:5173"
RECONNECT_MS = "60000"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
